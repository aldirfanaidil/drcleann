services:
  # Web Service
  - type: web
    name: drshoezclean
    runtime: docker
    plan: free
    buildCommand: |
      # Install dependencies
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build-css
    startCommand: |
      # Start PHP built-in server
      php -S 0.0.0.0:$PORT -t .
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: drshoezclean-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: drshoezclean-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: drshoezclean-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: drshoezclean-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: drshoezclean-db
          property: password

